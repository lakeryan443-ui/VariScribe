<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formora PDF Round-trip Proof</title>
  <style>
    body { max-width: 720px; margin: 40px auto; padding: 0 20px; font: 16px/1.5 system-ui, sans-serif; color: #233; }
    label { display: block; margin: 16px 0; font-weight: 600; }
    input, textarea { display: block; width: 100%; margin-top: 5px; padding: 9px; font: inherit; box-sizing: border-box; }
    button { margin: 0 8px 8px 0; padding: 9px 14px; font: inherit; cursor: pointer; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Formora PDF round-trip proof</h1>
  <p>Exports a static PDF with embedded JSON, then restores the JSON from a selected PDF.</p>
  <label>Client name<input id="clientName" value="Sample Client"></label>
  <label>Application note<textarea id="note">Original note</textarea></label>
  <button id="export" type="button">Save &amp; Download PDF</button>
  <button id="roundtrip" type="button">Run round-trip check</button>
  <label>Open Formora PDF<input id="import" type="file" accept="application/pdf"></label>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script>
    const schemaVersion = 1;
    const attachmentName = 'formora-data.json';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';

    function setStatus(message) {
      document.getElementById('status').textContent = message;
    }

    function applicationData() {
      return {
        schemaVersion,
        clientName: document.getElementById('clientName').value,
        note: document.getElementById('note').value,
      };
    }

    async function createPdf(data) {
      const pdf = await PDFLib.PDFDocument.create();
      const page = pdf.addPage([612, 792]);
      const font = await pdf.embedFont(PDFLib.StandardFonts.Helvetica);
      page.drawText('Formora Application', { x: 54, y: 730, size: 20, font });
      page.drawText(`Client: ${data.clientName || 'Not provided'}`, { x: 54, y: 690, size: 12, font });
      page.drawText(`Note: ${(data.note || 'Not provided').replace(/[\r\n]+/g, ' ')}`, { x: 54, y: 668, size: 12, font, maxWidth: 500 });
      await pdf.attach(new TextEncoder().encode(JSON.stringify(data)), attachmentName, {
        mimeType: 'application/json',
        description: 'Editable Formora application data',
      });
      return pdf.save();
    }

    async function exportPdf() {
      const bytes = await createPdf(applicationData());
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'formora-roundtrip-proof.pdf';
      link.click();
      URL.revokeObjectURL(url);
      setStatus('PDF exported with embedded application data.');
    }

    async function readApplicationData(bytes) {
      const documentProxy = await pdfjsLib.getDocument({ data: bytes }).promise;
      const attachments = await documentProxy.getAttachments();
      const attachment = attachments && attachments[attachmentName];
      if (!attachment) throw new Error('This PDF does not contain Formora application data.');
      const data = JSON.parse(new TextDecoder().decode(attachment.content));
      if (data.schemaVersion !== schemaVersion) throw new Error('This Formora PDF uses an unsupported data version.');
      return data;
    }

    function restoreApplicationData(data) {
      document.getElementById('clientName').value = data.clientName || '';
      document.getElementById('note').value = data.note || '';
    }

    async function importPdf(file) {
      const data = await readApplicationData(new Uint8Array(await file.arrayBuffer()));
      restoreApplicationData(data);
      setStatus('Application data restored. Edit a value and export a corrected PDF.');
    }

    async function runRoundTripCheck() {
      const original = applicationData();
      const originalBytes = await createPdf(original);
      const originalSize = originalBytes.length;
      document.getElementById('clientName').value = 'Changed after export';
      document.getElementById('note').value = 'Changed after export';
      const restoredOriginal = await readApplicationData(new Uint8Array(originalBytes));
      if (JSON.stringify(restoredOriginal) !== JSON.stringify(original)) throw new Error('Imported data did not match the original PDF.');
      restoreApplicationData(restoredOriginal);
      document.getElementById('note').value = 'Corrected note';
      const corrected = applicationData();
      const correctedBytes = await createPdf(corrected);
      const correctedSize = correctedBytes.length;
      const correctedPdf = await PDFLib.PDFDocument.load(new Uint8Array(correctedBytes));
      if (correctedPdf.getForm().getFields().length !== 0) throw new Error('Generated PDF contains interactive form fields.');
      await importPdf(new File([correctedBytes], 'corrected.pdf', { type: 'application/pdf' }));
      if (JSON.stringify(applicationData()) !== JSON.stringify(corrected)) throw new Error('Corrected PDF did not preserve the edited data.');
      setStatus(`PASS: original (${originalSize} bytes) and corrected (${correctedSize} bytes) PDFs reimported; no interactive fields.`);
    }

    document.getElementById('export').addEventListener('click', () => {
      exportPdf().catch(error => setStatus(`Export failed: ${error.message}`));
    });
    document.getElementById('roundtrip').addEventListener('click', () => {
      runRoundTripCheck().catch(error => setStatus(`Round-trip failed: ${error.message}`));
    });
    document.getElementById('import').addEventListener('change', event => {
      const [file] = event.target.files;
      if (file) importPdf(file).catch(error => setStatus(`Import failed: ${error.message}`));
    });
  </script>
</body>
</html>
